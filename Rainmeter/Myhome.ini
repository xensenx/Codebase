[Rainmeter]
Update=1000

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%B %d, %Y

[MeterDay]
Meter=String
MeasureName=MeasureDay
X=200
Y=0
FontSize=30
FontWeight=700
FontColor=255,255,255,255
FontFace=Ethnocentric Regular
StringAlign=Center
StringCase=Upper
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=200
Y=-5R
FontSize=16
FontWeight=400
FontColor=255,255,255,180
FontFace=Exo2 Medium
StringAlign=Center
StringCase=Upper
AntiAlias=1

; The font used in this is available in the font directory of this repository
